name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    # Only pull requests have a dependency diff to review.
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4

    # Reported as a check but non-blocking until the repository dependency graph is
    # confirmed to be enabled; remove `continue-on-error` to make it a hard gate.
    - name: Review dependency changes for known vulnerabilities
      continue-on-error: true
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log

    - name: Report Gradle failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f gradle-build.log ]]; then
          echo "--- first errors in gradle-build.log ---"
          head_lines=$(grep -n -m 25 -E '^(e: |error:|w: .*error|FAILURE:|> Task .*FAILED|Execution failed for task|\* What went wrong:|Caused by:|Exception)' gradle-build.log || true)
          printf '%s\n' "$head_lines"
          # Also surface these as an annotation: annotations are readable from the PR checks
          # UI and the API even when raw job logs are not accessible.
          head=$(printf '%s\n' "$head_lines" | head -n 12 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          if [[ -n "$head" ]]; then
            echo "::error title=Gradle build diagnostics (first errors)::$head"
          fi
          echo "--- end of gradle-build.log ---"
          tail -n 25 gradle-build.log
          summary=$(tail -n 30 gradle-build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Gradle build diagnostics::$summary"
        fi

    - name: Preserve checked-in Room v19 schema
      shell: bash
      run: |
        schema_path=app/schemas/com.aktarjabed.inbusiness.data.database.AppDatabase/19.json
        cp "$schema_path" "$RUNNER_TEMP/room-v19-expected.json"
        rm "$schema_path"

    - name: Generate Room v19 schema
      id: generate_room_schema
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        ./gradlew clean :app:kaptDebugKotlin --no-build-cache --stacktrace --console=plain 2>&1 | tee room-schema.log

    - name: Report Room schema generation failure
      if: steps.generate_room_schema.outcome == 'failure'
      shell: bash
      run: |
        details=$(grep -A 18 'An issue was found when checking AAR metadata:' room-schema.log | head -n 19 || true)
        if [[ -z "$details" ]]; then
          details=$(grep -E '(^FAILURE:|^\* What went wrong:|^Execution failed|^> |^Caused by:|^e: |^error:)' room-schema.log | tail -n 25 || true)
        fi
        if [[ -z "$details" ]]; then
          details=$(tail -n 20 room-schema.log)
        fi
        summary=$(printf '%s\n' "$details" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
        echo "::error title=Room schema generation diagnostics::$summary"

    - name: Upload Room schema generation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-v19-schema
        path: |
          room-schema.log
          app/schemas/com.aktarjabed.inbusiness.data.database.AppDatabase/19.json
        if-no-files-found: warn

    - name: Run Unit Tests
      # --no-build-cache forces real execution: a task served entirely from the build
      # cache writes no JUnit XML, so the verification step below could not tell the
      # difference between "tests passed" and "tests never ran".
      run: ./gradlew testDebugUnitTest --no-build-cache --stacktrace --console=plain 2>&1 | tee unit-test.log

    # A green test step is worthless if the task was skipped or discovered no tests.
    # This gate asserts the JUnit XML exists, that the security/regression suites really
    # executed, and that the run is clean.
    - name: Verify unit tests actually executed
      shell: bash
      run: |
        results_dir=app/build/test-results/testDebugUnitTest
        if [[ ! -d "$results_dir" ]]; then
          echo "::error title=Unit tests produced no results::$results_dir does not exist - the test task did not run."
          exit 1
        fi
        python3 - <<'PY'
        import glob, os, sys, xml.etree.ElementTree as ET

        files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'))
        total = failures = errors = skipped = 0
        for path in files:
            root = ET.parse(path).getroot()
            total += int(root.get('tests', 0) or 0)
            failures += int(root.get('failures', 0) or 0)
            errors += int(root.get('errors', 0) or 0)
            skipped += int(root.get('skipped', 0) or 0)
        print(f"Unit tests: {total} cases in {len(files)} classes "
              f"({failures} failures, {errors} errors, {skipped} skipped)")
        print(f"::notice title=Unit tests executed::{total} cases in {len(files)} classes, "
              f"{failures} failures, {errors} errors, {skipped} skipped")

        required = [
            'BackupPolicyTest',
            'PdfCacheManagerTest',
            'InvoiceHistoryFilterTest',
            'RequestFingerprintTest',
            'SystemClockTest',
            'AppDateUtilsTest',
        ]
        names = {os.path.basename(f) for f in files}
        missing = [cls for cls in required if not any(cls in n for n in names)]

        problems = []
        if not files:
            problems.append('no JUnit XML was produced')
        if total == 0:
            problems.append('zero test cases executed')
        if failures or errors:
            problems.append(f'{failures} failures / {errors} errors')
        if missing:
            problems.append('missing critical suites: ' + ', '.join(missing))
        if problems:
            for problem in problems:
                print(f"::error title=Unit test verification failed::{problem}")
            sys.exit(1)
        PY

    - name: Report unit test failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f unit-test.log ]]; then
          echo "--- first errors in unit-test.log ---"
          head_lines=$(grep -n -m 25 -E '^(e: |error:|w: .*error|FAILURE:|> Task .*FAILED|Execution failed for task|\* What went wrong:|Caused by:|Exception)' unit-test.log || true)
          printf '%s\n' "$head_lines"
          # Also surface these as an annotation: annotations are readable from the PR checks
          # UI and the API even when raw job logs are not accessible.
          head=$(printf '%s\n' "$head_lines" | head -n 12 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          if [[ -n "$head" ]]; then
            echo "::error title=Unit test diagnostics (first errors)::$head"
          fi
          echo "--- end of unit-test.log ---"
          tail -n 25 unit-test.log
          summary=$(tail -n 30 unit-test.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Unit test diagnostics::$summary"
        fi

    - name: Run Android Lint
      run: ./gradlew lintDebug --no-build-cache --stacktrace --console=plain 2>&1 | tee lint.log

    - name: Verify lint report was produced
      shell: bash
      run: |
        if [[ ! -s app/build/reports/lint-results-debug.html ]]; then
          echo "::error title=Android lint produced no report::app/build/reports/lint-results-debug.html is missing or empty - lint did not execute."
          exit 1
        fi

    - name: Report lint failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f lint.log ]]; then
          echo "--- first errors in lint.log ---"
          head_lines=$(grep -n -m 25 -E '^(e: |error:|w: .*error|FAILURE:|> Task .*FAILED|Execution failed for task|\* What went wrong:|Caused by:|Exception)' lint.log || true)
          printf '%s\n' "$head_lines"
          # Also surface these as an annotation: annotations are readable from the PR checks
          # UI and the API even when raw job logs are not accessible.
          head=$(printf '%s\n' "$head_lines" | head -n 12 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          if [[ -n "$head" ]]; then
            echo "::error title=Android lint diagnostics (first errors)::$head"
          fi
          echo "--- end of lint.log ---"
          tail -n 25 lint.log
          summary=$(tail -n 30 lint.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Android lint diagnostics::$summary"
        fi

    - name: Verify Room v19 schema was generated
      if: always()
      shell: bash
      run: |
        schema_path=app/schemas/com.aktarjabed.inbusiness.data.database.AppDatabase/19.json
        if [[ "${{ steps.generate_room_schema.outcome }}" != "success" ]]; then
          echo "::error file=.github/workflows/android.yml::Room Kapt schema export task failed."
          exit 1
        fi
        if [[ ! -s "$schema_path" ]]; then
          echo "::error file=.github/workflows/android.yml::Room v19 schema is missing after the Kapt export."
          exit 1
        fi
        if ! cmp -s "$schema_path" "$RUNNER_TEMP/room-v19-expected.json"; then
          diff -u "$RUNNER_TEMP/room-v19-expected.json" "$schema_path" || true
          echo "::error file=.github/workflows/android.yml::Generated Room v19 schema differs from the checked-in snapshot."
          exit 1
        fi

    - name: Upload Unit Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          app/build/reports/tests/testDebugUnitTest/
          app/build/test-results/testDebugUnitTest/
        if-no-files-found: error

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: app/build/reports/lint-results-debug.html
        if-no-files-found: error

    - name: Upload Gradle logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-logs
        path: |
          gradle-build.log
          room-schema.log
          unit-test.log
          lint.log
        if-no-files-found: warn

  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest --no-build-cache --stacktrace --console=plain 2>&1 | tee instrumentation.log

    - name: Verify instrumented tests actually executed
      shell: bash
      run: |
        results=$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null | wc -l)
        if [[ "$results" -eq 0 ]]; then
          echo "::error title=Instrumented tests produced no results::No JUnit XML under app/build/outputs/androidTest-results - the connected run did not execute tests."
          find app/build -maxdepth 4 -type d 2>/dev/null | head -40 || true
          exit 1
        fi
        python3 - <<'PY'
        import glob, sys, xml.etree.ElementTree as ET

        files = sorted(glob.glob('app/build/outputs/androidTest-results/**/TEST-*.xml', recursive=True))
        total = failures = errors = skipped = 0
        for path in files:
            root = ET.parse(path).getroot()
            total += int(root.get('tests', 0) or 0)
            failures += int(root.get('failures', 0) or 0)
            errors += int(root.get('errors', 0) or 0)
            skipped += int(root.get('skipped', 0) or 0)
        print(f"Instrumented tests: {total} cases in {len(files)} classes "
              f"({failures} failures, {errors} errors, {skipped} skipped)")
        print(f"::notice title=Instrumented tests executed::{total} cases in {len(files)} classes, "
              f"{failures} failures, {errors} errors, {skipped} skipped")
        if total == 0:
            sys.exit('::error title=Instrumented test verification failed::zero test cases executed')
        if failures or errors:
            sys.exit(f"::error title=Instrumented test verification failed::{failures} failures / {errors} errors")
        PY

    - name: Report instrumented test failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f instrumentation.log ]]; then
          echo "--- first errors in instrumentation.log ---"
          head_lines=$(grep -n -m 25 -E '^(e: |error:|w: .*error|FAILURE:|> Task .*FAILED|Execution failed for task|\* What went wrong:|Caused by:|Exception)' instrumentation.log || true)
          printf '%s\n' "$head_lines"
          # Also surface these as an annotation: annotations are readable from the PR checks
          # UI and the API even when raw job logs are not accessible.
          head=$(printf '%s\n' "$head_lines" | head -n 12 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          if [[ -n "$head" ]]; then
            echo "::error title=Instrumented test diagnostics (first errors)::$head"
          fi
          echo "--- end of instrumentation.log ---"
          tail -n 25 instrumentation.log
          summary=$(tail -n 30 instrumentation.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Instrumented test diagnostics::$summary"
        fi

    - name: Upload Instrumented Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-reports
        path: |
          app/build/reports/androidTests/connected/
          app/build/outputs/androidTest-results/
        if-no-files-found: error

    - name: Upload Instrumented log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumentation-log
        path: instrumentation.log
        if-no-files-found: warn
