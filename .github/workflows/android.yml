name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log

    - name: Report Gradle failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f gradle-build.log ]]; then
          tail -n 40 gradle-build.log
          summary=$(tail -n 30 gradle-build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Gradle build diagnostics::$summary"
        fi

    - name: Generate Room v19 schema
      id: generate_room_schema
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        ./gradlew :app:kaptDebugKotlin --rerun-tasks --no-build-cache --stacktrace --console=plain 2>&1 | tee room-schema.log

    - name: Report Room schema generation failure
      if: steps.generate_room_schema.outcome == 'failure'
      shell: bash
      run: |
        tail -n 40 room-schema.log
        summary=$(tail -n 30 room-schema.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
        echo "::error title=Room schema generation diagnostics::$summary"

    - name: Upload Room schema generation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-v19-schema
        path: |
          room-schema.log
          app/schemas/com.aktarjabed.inbusiness.data.database.AppDatabase/19.json
        if-no-files-found: warn

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-test.log

    - name: Report unit test failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f unit-test.log ]]; then
          tail -n 40 unit-test.log
          summary=$(tail -n 30 unit-test.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Unit test diagnostics::$summary"
        fi

    - name: Run Android Lint
      run: ./gradlew lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

    - name: Report lint failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f lint.log ]]; then
          tail -n 40 lint.log
          summary=$(tail -n 30 lint.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Android lint diagnostics::$summary"
        fi

    - name: Verify Room v19 schema was generated
      if: always()
      shell: bash
      run: |
        schema_path=app/schemas/com.aktarjabed.inbusiness.data.database.AppDatabase/19.json
        if [[ ! -s "$schema_path" ]]; then
          echo "::error file=.github/workflows/android.yml::Room v19 schema is missing after the forced Kapt export."
          exit 1
        fi

    - name: Upload Unit Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/reports/tests/testDebugUnitTest/

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: app/build/reports/lint-results-debug.html

  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest --stacktrace --console=plain 2>&1 | tee instrumentation.log

    - name: Report instrumented test failure details
      if: failure()
      shell: bash
      run: |
        if [[ -f instrumentation.log ]]; then
          tail -n 50 instrumentation.log
          summary=$(tail -n 35 instrumentation.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' ' -)
          echo "::error title=Instrumented test diagnostics::$summary"
        fi

    - name: Upload Instrumented Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-reports
        path: app/build/reports/androidTests/connected/
